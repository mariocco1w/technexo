spring:
  application:
    name: technexo-backend
  config:
    import: optional:file:./config/application-local.yml
  datasource:
    url: ${TECHNEXO_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=TechNexoDB;encrypt=false;trustServerCertificate=true;loginTimeout=30}
    username: ${TECHNEXO_DB_USERNAME:technexo_app}
    password: ${TECHNEXO_DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
  thymeleaf:
    cache: false
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: 30m
logging:
  level:
    org.hibernate.SQL: INFO
    com.technexo: INFO
