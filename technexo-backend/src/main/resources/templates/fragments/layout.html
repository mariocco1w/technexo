<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">TechNexo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/technexo.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark tn-nav">
    <div class="container">
        <a class="navbar-brand" href="/">TechNexo</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/catalogo">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link" href="/reservas">Reservas</a></li>
                <li class="nav-item"><a class="nav-link" href="/pedidos">Pedidos</a></li>
                <li class="nav-item"><a class="nav-link" href="/inventario">Inventario</a></li>
                <li class="nav-item"><a class="nav-link" href="/checkout">Checkout</a></li>
            </ul>
            <form class="d-flex tn-search" action="/buscar" method="get">
                <input class="form-control me-2" type="search" name="q" placeholder="SKU, marca, modelo">
                <button class="btn" type="submit">Buscar</button>
            </form>
        </div>
    </div>
</nav>

<th:block th:fragment="alertas">
    <div th:if="${ok}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${ok}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</th:block>

<div th:fragment="cierre">
<aside class="tn-chat" id="tn-chat">
    <button type="button" class="tn-chat-toggle" id="tn-chat-toggle">Asistente</button>
    <section class="tn-chat-panel" id="tn-chat-panel" hidden>
        <header class="tn-chat-head">
            <span>// asistente de catálogo</span>
            <button type="button" id="tn-chat-close">Cerrar</button>
        </header>
        <div class="tn-chat-log" id="tn-chat-log">
            <p class="tn-chat-ayuda">Pregunta por equipos reales del catálogo. Ejemplo: switches de 24 puertos con PoE+.</p>
        </div>
        <form class="tn-chat-form" id="tn-chat-form">
            <input id="tn-chat-input" type="text" maxlength="2000" placeholder="Puertos, PoE+, precio, disponibilidad" required>
            <button type="submit">Enviar</button>
        </form>
    </section>
</aside>
<footer class="tn-footer">
    <div class="container">TechNexo // catálogo · reservas · inventario</div>
</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/chat.js}"></script>
    <script>
        const ruta = location.pathname;
        let activa = "/";
        if (ruta.startsWith("/catalogo") || ruta.startsWith("/producto") || ruta.startsWith("/buscar")) {
            activa = "/catalogo";
        } else if (ruta.startsWith("/reservas")) {
            activa = "/reservas";
        } else if (ruta.startsWith("/pedidos")) {
            activa = "/pedidos";
        } else if (ruta.startsWith("/inventario")) {
            activa = "/inventario";
        } else if (ruta.startsWith("/checkout")) {
            activa = "/checkout";
        }
        document.querySelectorAll(".tn-nav .nav-link").forEach(function (enlace) {
            if (enlace.getAttribute("href") === activa) {
                enlace.classList.add("active");
            }
        });
    </script>
</div>

</body>
</html>
