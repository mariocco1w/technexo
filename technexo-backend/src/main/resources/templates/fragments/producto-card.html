<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<article th:fragment="tarjeta(p)" class="tn-card-product">
    <header class="tn-card-top">
        <span class="tn-chip" th:text="${p.categoria}">Categoría</span>
        <span class="tn-pill" th:classappend="${p.stockDisponible > 0} ? 'is-live' : 'is-off'">
            <span class="tn-pulse" th:if="${p.stockDisponible > 0}" aria-hidden="true"></span>
            <span th:text="${p.stockDisponible > 0} ? (${p.stockDisponible} + ' disponibles') : 'Sin stock'">Disponible</span>
        </span>
    </header>
    <div class="tn-stage">
        <svg th:replace="~{fragments/hardware :: equipo}"></svg>
    </div>
    <div class="tn-card-body">
        <h3 th:text="${p.nombre}">Nombre</h3>
        <p class="tn-brand" th:text="${p.marca}">Marca</p>
        <p class="tn-sku" th:text="${p.sku}">SKU</p>
        <ul class="tn-spec-pills" th:if="${p.descripcion != null}">
            <li th:each="parte, st : ${#strings.arraySplit(p.descripcion, ',')}"
                th:if="${st.index < 3 and !#strings.isEmpty(#strings.trim(parte))}"
                th:text="${#strings.abbreviate(#strings.trim(parte), 42)}">Spec</li>
        </ul>
        <div class="tn-card-buy">
            <p class="tn-price">
                <span class="tn-price-num" th:text="${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                <span class="tn-price-cur" th:text="${p.moneda}">GTQ</span>
            </p>
            <a class="btn btn-primary btn-sm" th:href="@{'/producto/' + ${p.id}}">Ver ficha</a>
        </div>
    </div>
</article>
</body>
</html>
