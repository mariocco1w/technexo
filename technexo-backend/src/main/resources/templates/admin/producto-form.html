<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='Producto - TechNexo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container mt-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <p class="tn-kicker">producto</p>
    <h1 th:text="${form.id == null} ? 'Registrar producto' : 'Editar producto'">Producto</h1>
    <form th:action="@{/admin/productos}" th:object="${form}" method="post" class="row g-3">
        <input type="hidden" th:field="*{id}">
        <div class="col-md-4"><label class="form-label">SKU</label><input class="form-control" th:field="*{sku}" required></div>
        <div class="col-md-8"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" required></div>
        <div class="col-12"><label class="form-label">Descripción</label><textarea class="form-control" th:field="*{descripcion}"></textarea></div>
        <div class="col-md-3"><label class="form-label">Precio</label><input class="form-control" type="number" step="0.01" min="0" th:field="*{precio}" required></div>
        <div class="col-md-3"><label class="form-label">Moneda</label>
            <select class="form-select" th:field="*{moneda}"><option value="GTQ">GTQ</option><option value="USD">USD</option></select>
        </div>
        <div class="col-md-3"><label class="form-label">Marca</label>
            <select class="form-select" th:field="*{idMarca}"><option th:each="m : ${marcas}" th:value="${m.idMarca}" th:text="${m.nombre}"></option></select>
        </div>
        <div class="col-md-3"><label class="form-label">Categoría</label>
            <select class="form-select" th:field="*{idCategoria}"><option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.nombre}"></option></select>
        </div>
        <div class="col-md-3" th:if="${form.id == null}"><label class="form-label">Stock inicial</label><input class="form-control" type="number" min="0" th:field="*{stockInicial}"></div>
        <div class="col-md-3" th:if="${form.id == null}"><label class="form-label">Stock mínimo</label><input class="form-control" type="number" min="0" th:field="*{stockMinimo}"></div>
        <div class="col-md-6" th:if="${form.id == null}"><label class="form-label">Ubicación</label><input class="form-control" th:field="*{ubicacion}"></div>
        <div class="col-md-4" th:if="${form.id != null}"><label class="form-label">Estado</label>
            <select class="form-select" th:field="*{estado}">
                <option value="ACTIVO">ACTIVO</option>
                <option value="INACTIVO">INACTIVO</option>
                <option value="DESCATALOGADO">DESCATALOGADO</option>
            </select>
        </div>
        <div class="col-12"><button class="btn btn-warning" type="submit">Guardar</button> <a href="/admin/productos">Volver</a></div>
    </form>

    <section th:if="${form.id != null}" class="mt-4">
        <h2 class="h5">Características técnicas</h2>
        <ul>
            <li th:each="a : ${atributosProducto}" th:text="${a.nombre + ': ' + a.valor + (a.unidad != null ? ' ' + a.unidad : '')}"></li>
        </ul>
        <p th:if="${atributosProducto.empty}">Sin características registradas.</p>
        <form th:action="@{'/admin/productos/' + ${form.id} + '/atributos'}" method="post" class="row g-2">
            <div class="col-md-4">
                <select class="form-select" name="idAtributo" required>
                    <option th:each="a : ${atributos}" th:value="${a.idAtributo}" th:text="${a.nombre + ' (' + a.tipoDato + ')'}"></option>
                </select>
            </div>
            <div class="col-md-4"><input class="form-control" name="valor" required placeholder="Valor"></div>
            <div class="col-md-4"><button class="btn btn-outline-warning" type="submit">Asignar</button></div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: cierre}"></footer>
</body>
</html>
