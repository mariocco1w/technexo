<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='Entrar - TechNexo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container mt-4" style="max-width: 32rem;">
    <p class="tn-kicker">acceso</p>
    <h1>Entrar</h1>
    <div th:if="${param.error}" class="alert alert-danger">Correo o contraseña incorrectos, o la cuenta está inactiva.</div>
    <div th:if="${param.logout}" class="alert alert-success">Sesión cerrada.</div>
    <form th:action="@{/login}" method="post" class="tn-panel p-3">
        <div class="mb-3">
            <label class="form-label" for="username">Correo</label>
            <input class="form-control" id="username" name="username" type="email" required autocomplete="username">
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-warning" type="submit">Entrar</button>
        <a class="btn btn-link" href="/registro">Crear cuenta</a>
    </form>
</main>
<footer th:replace="~{fragments/layout :: cierre}"></footer>
</body>
</html>
