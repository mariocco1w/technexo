<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='Entrar - TechNexo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container tn-auth">
    <section class="tn-auth-card">
        <p class="tn-kicker">acceso</p>
        <h1>Entrar</h1>
        <p class="tn-auth-lead">Catálogo, inventario y reservas de hardware.</p>
        <div th:if="${param.error}" class="alert alert-danger">Correo o contraseña incorrectos, o la cuenta está inactiva.</div>
        <div th:if="${param.logout}" class="alert alert-success">Sesión cerrada.</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Correo</label>
                <div class="tn-input">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"></rect>
                        <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                    </svg>
                    <input class="form-control" id="username" name="username" type="email" required autocomplete="username" placeholder="correo@technexo.local">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <div class="tn-input">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"></rect>
                        <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                    </svg>
                    <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password" placeholder="Contraseña">
                </div>
            </div>
            <button class="btn btn-primary" type="submit">Entrar</button>
        </form>
        <p class="tn-auth-alt">¿Aún sin cuenta? <a href="/registro">Crear cuenta</a></p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: cierre}"></footer>
</body>
</html>
