<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='TechNexo - Inicio')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container mt-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="tn-hero p-4 mb-4">
        <p class="tn-kicker mb-2">01 / nodo de catálogo</p>
        <h1 class="display-6 mb-2">Equipos de red y telecomunicaciones</h1>
        <p class="lead mb-0">Stock en vivo, reserva de 30 minutos y precio fijado al confirmar el pedido.</p>
    </div>

    <h4 class="mb-3">Unidades disponibles</h4>
    <div th:if="${productos.empty}" class="alert alert-info">No hay productos activos registrados.</div>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="p : ${productos}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.nombre}">Nombre</h5>
                    <p class="card-text text-muted mb-1" th:text="${p.sku}">SKU</p>
                    <p class="card-text mb-2">
                        <small>Marca: <span th:text="${p.marca}"></span> |
                            Categoría: <span th:text="${p.categoria}"></span></small>
                    </p>
                    <p class="card-text fw-bold mb-1 tn-price" th:text="${p.precio + ' ' + p.moneda}">0.00 GTQ</p>
                    <span class="badge" th:classappend="${p.stockDisponible > 0} ? 'bg-success' : 'bg-secondary'"
                          th:text="${p.stockDisponible > 0 ? 'Disponible: ' + p.stockDisponible : 'Sin disponibilidad'}">Disponible</span>
                </div>
                <div class="card-footer">
                    <a th:href="@{'/producto/' + ${p.id}}" class="btn btn-primary btn-sm">Ver detalle</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: cierre}"></footer>
</body>
</html>
