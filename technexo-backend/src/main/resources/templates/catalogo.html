<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='TechNexo - Catálogo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container mt-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <header class="tn-page-head">
        <p class="tn-kicker">02 / consulta</p>
        <h1>Catálogo de productos</h1>
        <p th:if="${q}">Resultados para «<span th:text="${q}"></span>».</p>
        <p th:unless="${q}">Fichas con marca, categoría, precio y disponibilidad actual.</p>
    </header>
    <form class="row g-2 mb-4" method="get" action="/catalogo">
        <div class="col-md-6">
            <label class="form-label" for="categoria">Categoría</label>
            <select class="form-select" id="categoria" name="categoria" onchange="this.form.submit()">
                <option value="">Todas las categorías activas</option>
                <option th:each="c : ${categorias}" th:value="${c.nombre}" th:text="${c.nombre}"
                        th:selected="${categoria == c.nombre}"></option>
            </select>
        </div>
    </form>
    <div th:if="${productos.empty}" class="alert alert-info">No se encontraron productos.</div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
        <div class="col" th:each="p : ${productos}">
            <article class="card h-100 tn-product">
                <div class="card-body">
                    <div class="tn-product-top">
                        <span class="tn-chip" th:text="${p.categoria}">Categoría</span>
                        <span class="badge" th:classappend="${p.stockDisponible > 0} ? 'bg-success' : 'bg-secondary'"
                              th:text="${p.stockDisponible > 0 ? 'Disponible: ' + p.stockDisponible : 'Sin stock'}">Disponible</span>
                    </div>
                    <p class="tn-sku" th:text="${p.sku}">SKU</p>
                    <h2 class="card-title h5" th:text="${p.nombre}">Nombre</h2>
                    <p class="tn-desc" th:text="${p.descripcion}">Descripción</p>
                    <p class="tn-brand">Marca: <span th:text="${p.marca}"></span></p>
                    <p class="tn-price" th:text="${p.precio + ' ' + p.moneda}">0.00 GTQ</p>
                </div>
                <div class="card-footer">
                    <a th:href="@{'/producto/' + ${p.id}}" class="btn btn-primary btn-sm">Ver ficha técnica</a>
                </div>
            </article>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: cierre}"></footer>
</body>
</html>
