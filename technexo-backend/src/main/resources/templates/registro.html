<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='Registro - TechNexo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container mt-4" style="max-width: 32rem;">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <p class="tn-kicker">cuenta nueva</p>
    <h1>Crear cuenta de cliente</h1>
    <form th:action="@{/registro}" method="post" class="tn-panel p-3">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input class="form-control" name="nombre" required maxlength="150" th:value="${nombre}">
        </div>
        <div class="mb-3">
            <label class="form-label">Correo</label>
            <input class="form-control" name="correo" type="email" required maxlength="254" th:value="${correo}">
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input class="form-control" name="password" type="password" required minlength="10" autocomplete="new-password">
            <small class="text-muted">Mínimo 10 caracteres, con letras y números.</small>
        </div>
        <button class="btn btn-warning" type="submit">Registrarme</button>
    </form>
</main>
<footer th:replace="~{fragments/layout :: cierre}"></footer>
</body>
</html>
